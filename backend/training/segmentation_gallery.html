<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>印脉重生 · 自动分割候选</title>
<style>body{margin:0;background:#f3ede1;color:#44362c;font:15px/1.7 system-ui,sans-serif}header,main{max-width:1400px;margin:auto;padding:24px}header{border-bottom:1px solid #d4c4ad}h1{font:700 30px serif;color:#873b2b;margin:0 0 12px}.note{padding:12px 18px;background:#fff5da;border-left:4px solid #ba862f}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:#f3ede1;padding:14px 0;z-index:2}input,select,button{font:inherit;padding:8px 12px;border:1px solid #c9b79e;border-radius:5px;background:#fffdf6;color:#44362c}input{max-width:320px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:18px}.card{background:#fffcf4;border:1px solid #dfd1bb;border-radius:8px;padding:15px;overflow:hidden}.card h2{font-size:15px;margin:0;overflow-wrap:anywhere}.detail{font-size:12px;color:#8d7557}.images{display:flex;gap:12px;margin:12px 0}.source{width:160px;height:160px;object-fit:contain;background:#e9e0cf}.crops{display:flex;gap:6px;flex-wrap:wrap;align-content:flex-start}.crops a{display:flex;flex-direction:column;align-items:center;font-size:11px;color:#705538;text-decoration:none}.crops img{width:64px;height:64px;object-fit:contain;background:#f2eadd}.warnings{font-size:12px;color:#8b6743}.footer{display:flex;gap:16px;align-items:center;margin-top:22px}#count{color:#873b2b;font-weight:600}@media(max-width:600px){header,main{padding:16px}#grid{grid-template-columns:1fr}.source{width:130px;height:130px}.images{gap:8px}nav input{width:100%}}</style>
<header><h1>印谱自动分割 · 待核对候选</h1><p>查看程序建议的字框和原色裁图，先整理素材，再建立有释文的训练集。</p><div class="note">所有文字和风格标签仍为空，尚未划分字体训练集。蓝框是候选边界；“整印保留”可能含多个字，粘连字、边框和朱白文判断均需核对。</div></header>
<main><nav><input id="query" aria-label="搜索原图文件名" placeholder="搜索文件名"><select id="layout" aria-label="筛选建议布局"><option value="">全部布局</option><option value="1x1">整印保留 · 重点复核</option><option value="1x2">1行2列</option><option value="1x3">1行3列</option><option value="2x1">2行1列</option><option value="3x1">3行1列</option><option value="2x2">2行2列</option><option value="2x3">2行3列</option><option value="3x2">3行2列</option><option value="3x3">3行3列</option><option value="none">未产生候选</option></select><span id="count"></span></nav><div id="grid"></div><div class="footer"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button><a href="glyph-candidates.csv" download>下载待整理清单</a></div></main>
<script src="data.js"></script><script>
let page=0;const size=24;const data=window.SEGMENTATION_DATA||[];const query=document.querySelector('#query'),layout=document.querySelector('#layout'),grid=document.querySelector('#grid');
function el(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e}
function render(){const rows=data.filter(r=>(!query.value||r.source_file.toLowerCase().includes(query.value.toLowerCase()))&&(!layout.value||(layout.value==='none'?!r.glyphs.length:r.layout===layout.value)));const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages-1);grid.replaceChildren();document.querySelector('#count').textContent=`${rows.length.toLocaleString()} 张素材 · 全部待核对`;
for(const r of rows.slice(page*size,(page+1)*size)){const c=el('article',null,'card');c.append(el('h2',r.source_file.split('/').pop()),el('div',`${r.layout==='1x1'?'整印保留':r.layout||'未确定布局'} · ${r.polarity||'待定'} · ${r.glyphs.length} 个候选`,'detail'));if(r.preview){const panel=el('div',null,'images'),im=el('img',null,'source');im.src=r.preview;im.alt='原图上的建议字框';im.loading='lazy';panel.append(im);const crops=el('div',null,'crops');for(const [i,g] of r.glyphs.entries()){const a=el('a'),thumb=el('img');a.href=g.crop;a.target='_blank';thumb.src=g.crop;thumb.loading='lazy';thumb.alt=`第${i+1}个未释文候选`;a.append(thumb,el('span',`${i+1} · 待释文`));crops.append(a)}panel.append(crops);c.append(panel)}c.append(el('p',(r.warnings||[r.error]).join(' '),'warnings'));grid.append(c)}document.querySelector('#page').textContent=`${page+1} / ${pages}`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page>=pages-1}
query.oninput=layout.onchange=()=>{page=0;render()};document.querySelector('#prev').onclick=()=>{page--;render();window.scrollTo(0,0)};document.querySelector('#next').onclick=()=>{page++;render();window.scrollTo(0,0)};render();
</script></html>
