<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>印脉重生 · 真实训练图像</title><style>
*{box-sizing:border-box}body{margin:0;background:#1d140f;color:#e8d0ac;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1440px;padding:32px 24px 60px;margin:auto}h1{font-size:30px;margin:0;color:#f2d3a0}p{margin:10px 0;color:#c4a582}.tag{display:inline-block;color:#f0b872;border:1px solid #86603a;border-radius:20px;padding:3px 12px;font-size:12px;margin:10px 0}.intro{background:#332219;border:1px solid #795233;border-radius:12px;padding:20px;margin:20px 0}.tools,.pagination{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}button,input,select,a.button{font:inherit;border:1px solid #87613e;border-radius:7px;padding:9px 14px;color:#ead1ad;background:#291d15}button{cursor:pointer}button.selected{background:#9c351e;border-color:#e28b4d;color:#fff2db}button:disabled{opacity:.45;cursor:default}a{color:#efb46c}input[type=search]{flex:1;min-width:190px}input[type=checkbox]{accent-color:#cf6940}label{display:flex;align-items:center;gap:8px}.stats{color:#f0c38a;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}.card{padding:10px;background:#33241a;border:1px solid #68482d;border-radius:9px;min-width:0}.image{height:155px;background:#f0e6d1;border-radius:5px;display:grid;place-items:center;overflow:hidden}.image img{max-width:95%;max-height:145px;object-fit:contain}.card h2{font-size:11px;word-break:break-all;font-weight:500;margin:8px 0 4px}.card small{font-size:11px;color:#bda17d}.pairs{display:flex;gap:6px}.pairs .image{height:130px;width:50%}.pairs img{width:100%;max-height:125px}.pair-card{grid-column:span 2}.pair-card h2{font-size:13px}.note{font-size:12px}.pagination{justify-content:center}.empty{padding:70px 0;text-align:center}.status{margin-left:auto;font-size:12px}footer{margin-top:30px;border-top:1px solid #67472d;padding-top:18px;color:#ae906d;font-size:12px}@media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:650px){main{padding:20px 14px}h1{font-size:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.image{height:135px}.pair-card{grid-column:span 2}.tools{gap:8px}button,input{font-size:13px}.intro{padding:15px}.status{margin-left:0;width:100%}}
</style></head><body><main><span class="tag">真实PNG · 已核验原图哈希 · 原目录保留</span><h1>印脉重生 · 真实训练图像</h1><div class="intro"><strong>实际包含13,646张古印谱裁图</strong><p>训练11,144张 / 验证1,167张 / 测试1,333张 / 过小排除2张。这里展示原图文件，不是UI参考图。</p><p class="note">没有释文标签或无损对照图。已完成的GPU基线学习“新增高斯噪声 → 原始有损裁图”，不代表缺笔恢复或古篆识别。</p><a href="真实训练输入对照.png" target="_blank" rel="noopener">查看首批实际训练输入与目标对照</a> · <a href="训练图像使用说明.md">图像与训练说明</a></div><div class="tools" id="tabs"><button class="selected" data-split="train">训练图像</button><button data-split="validation">验证图像</button><button data-split="test">测试图像</button><button data-split="excluded">排除图片</button><button data-split="first_batch">首批输入 / 目标</button></div><div class="tools"><input id="query" type="search" placeholder="按文件名或来源页查找" aria-label="查找训练图片"><label><input type="checkbox" id="used">只看已用于GPU基线的图片</label><span class="status">原始文件没有文字标签</span></div><div class="stats" id="stats" role="status"></div><div class="grid" id="grid"></div><div class="pagination"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div><footer>图片原始来源为用户本机raw_crops；训练组、验证组和测试组按来源页隔离。首批图像已回放核验：损失与原训练记录完全一致。PNG仅作8位预览，精确浮点输入保存在NPZ中。</footer></main><script type="application/json" id="catalog">__CATALOG_JSON__</script><script>
const data=JSON.parse(document.getElementById('catalog').textContent);let split='train',page=0;const perPage=48;const grid=document.getElementById('grid'),query=document.getElementById('query'),used=document.getElementById('used');
function image(path,alt){const a=document.createElement('a');a.href=encodeURI(path);a.target='_blank';a.rel='noopener';a.className='image';const img=document.createElement('img');img.src=encodeURI(path);img.alt=alt;img.loading='lazy';a.append(img);return a}
function render(){const paired=split==='first_batch';used.disabled=paired;let rows=paired?data.first_batch:data.items.filter(r=>r.split===split&&(!used.checked||r.baseline_used));const term=query.value.trim().toLowerCase();if(term)rows=rows.filter(r=>(r.name||r.source_name).toLowerCase().includes(term)||(r.page||'').toLowerCase().includes(term));const pages=Math.max(1,Math.ceil(rows.length/perPage));page=Math.min(page,pages-1);grid.replaceChildren();for(const r of rows.slice(page*perPage,(page+1)*perPage)){const card=document.createElement('article');card.className='card'+(paired?' pair-card':'');if(paired){const pair=document.createElement('div');pair.className='pairs';pair.append(image(r.input,'实际首步合成噪声输入'),image(r.target,'原始有损裁图目标'));card.append(pair)}else card.append(image(r.path,r.name));const title=document.createElement('h2');title.textContent=paired?r.source_name:r.name;card.append(title);const label=document.createElement('small');label.textContent=paired?'左：训练输入 / 右：原裁图目标':r.width+'×'+r.height+'px · '+r.page+(r.baseline_used?' · 已用于GPU基线':'');card.append(label);grid.append(card)}document.getElementById('stats').textContent=paired?'已核验的第1步训练输入：'+rows.length+'组，目标仍是原始有损扫描':'当前筛选：'+rows.length.toLocaleString()+'张实际PNG';document.getElementById('page').textContent=(page+1)+' / '+pages;document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page>=pages-1;document.querySelectorAll('[data-split]').forEach(b=>b.classList.toggle('selected',b.dataset.split===split));if(!rows.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='没有匹配的图片';grid.append(empty)}}
document.getElementById('tabs').addEventListener('click',e=>{const button=e.target.closest('[data-split]');if(!button)return;split=button.dataset.split;page=0;render()});query.addEventListener('input',()=>{page=0;render()});used.addEventListener('change',()=>{page=0;render()});document.getElementById('prev').onclick=()=>{page--;render();document.getElementById('tabs').scrollIntoView({behavior:'smooth'})};document.getElementById('next').onclick=()=>{page++;render();document.getElementById('tabs').scrollIntoView({behavior:'smooth'})};render();
</script></body></html>
